ogging spending and summarizing it by category.']];const entrance=document.querySelector('#entrance'),experience=document.querySelector('#experience'),content=document.querySelector('#content'),menu=document.querySelector('#menu'),dots=document.querySelector('#dots');let page=-1,busy=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const wait=n=>reduced?20:n;

const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let w,h,dpr,boost=0,raf=0;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);paint()}function pulse(){boost=1;if(!raf)raf=requestAnimationFrame(animate)}function animate(){boost*=.965;paint();if(boost>.01)raf=requestAnimationFrame(animate);else{boost=0;raf=0;paint()}}function paint(){if(!w)return;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h*.47;let scale=1+boost*.8;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);let unit=Math.min(w,h);for(let i=5;i>=0;i--){let f=Math.pow(.72,i),aw=unit*1.55*f,ah=unit*1.12*f;ctx.strokeStyle=`rgba(191,204,184,${.07+(5-i)*.009})`;ctx.lineWidth=Math.max(1,3*f);ctx.beginPath();ctx.moveTo(-aw/2,ah*.56);ctx.lineTo(-aw/2,-ah*.16);ctx.bezierCurveTo(-aw/2,-ah*.48,-aw*.3,-ah*.55,0,-ah*.55);ctx.bezierCurveTo(aw*.3,-ah*.55,aw/2,-ah*.48,aw/2,-ah*.16);ctx.lineTo(aw/2,ah*.56);ctx.stroke()}ctx.strokeStyle='rgba(176,203,188,.10)';for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(i*unit*.06,unit*.12);ctx.lineTo(i*unit*.36,unit*.68);ctx.stroke()}for(let i=0;i<6;i++){let y=unit*(.18+Math.pow(i/5,2)*.55);ctx.beginPath();ctx.moveTo(-w,y);ctx.lineTo(w,y);ctx.stroke()}ctx.restore()}window.addEventListener('resize',resize,{passive:true});resize();
